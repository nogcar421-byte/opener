<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Opener</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#0c0c18;color:#e4e4ea;font-family:system-ui,-apple-system,sans-serif;padding:24px 20px}
.c{text-align:center;max-width:340px;width:100%}
.sp{width:44px;height:44px;border:3px solid rgba(42,171,238,.2);border-top-color:#2aabee;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 20px}
@keyframes s{to{transform:rotate(360deg)}}
.icon{font-size:40px;margin-bottom:14px;line-height:1}
h2{font-size:18px;font-weight:600;margin-bottom:8px;text-wrap:balance}
p{font-size:13px;color:#7a7a90;line-height:1.55}
.alts{margin-top:22px;display:none;flex-direction:column;gap:8px}
.alts .lbl{font-size:11px;color:#5a5a70;text-transform:uppercase;letter-spacing:.06em}
a.btn{display:block;padding:12px 16px;border-radius:10px;background:#1a1a2e;border:1px solid #2a2a44;color:#cfcfe0;text-decoration:none;font-size:14px;font-weight:500}
a.btn:hover{background:#22223a;border-color:#3a3a5a}
a.btn code{color:#2aabee;font-family:ui-monospace,monospace;font-size:13px}
.ctx{margin-top:18px;font-size:11px;color:#44445a;font-family:ui-monospace,monospace}
@media(prefers-reduced-motion:reduce){.sp{animation:none}}
</style>
</head>
<body>
<div class="c" id="root">
<div class="sp" id="sp"></div>
<h2 id="h">Открываю…</h2>
<p id="m">Если появится запрос разрешения — подтверди.</p>
<div class="alts" id="alts"><div class="lbl">Не открылось? Вручную:</div></div>
<div class="ctx" id="ctx"></div>
</div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && typeof tg.initData === 'string');
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  var app = q.get('app') === 'term' ? 'term' : 'calc';
  var ua = navigator.userAgent;
  var isWin = /Windows/i.test(ua);
  var isMac = /Mac/i.test(ua);

  var sp = document.getElementById('sp');
  var h = document.getElementById('h');
  var m = document.getElementById('m');
  var alts = document.getElementById('alts');

  document.getElementById('ctx').textContent =
    (inTelegram ? 'Telegram Mini App' : 'браузер') +
    ' · ' + (isWin ? 'Windows' : isMac ? 'macOS' : 'другая ОС') +
    (inTelegram && tg.platform ? ' · ' + tg.platform : '');

  function stop(icon, title, text) {
    sp.style.display = 'none';
    if (icon) {
      var d = document.createElement('div');
      d.className = 'icon';
      d.textContent = icon;
      document.getElementById('root').insertBefore(d, h);
    }
    h.textContent = title;
    m.textContent = text;
  }

  if (app === 'term') {
    stop('⛔', 'Терминал открыть нельзя',
      'Ни одна URL-схема не ведёт к терминалу — ни в Windows, ни в macOS. Это сделано намеренно: иначе любая веб-страница могла бы запустить консоль.');
    return;
  }

  if (!isWin && !isMac) {
    stop('💻', 'Только для десктопа',
      'URL-схемы приложений работают на Windows и macOS. На телефоне такого нет.');
    return;
  }

  var schemes = isWin ? ['calculator:', 'ms-calculator:'] : ['calculator:'];

  h.textContent = 'Открываю Калькулятор…';

  schemes.forEach(function (scheme) {
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = scheme;
    a.innerHTML = 'Открыть через <code>' + scheme + '</code>';
    alts.appendChild(a);
  });

  var primary = schemes[0];
  var frame = document.createElement('iframe');
  frame.style.display = 'none';
  frame.src = primary;
  document.body.appendChild(frame);

  setTimeout(function () {
    try { window.location.href = primary; } catch (e) {}
  }, 400);

  setTimeout(function () {
    sp.style.display = 'none';
    h.textContent = 'Запрос отправлен';
    m.textContent = isMac
      ? 'На macOS схема calculator: обычно не зарегистрирована — скорее всего ничего не откроется.'
      : 'Если Калькулятор не открылся, попробуй кнопку ниже.';
    alts.style.display = 'flex';
  }, 2200);
})();
</script>
</body>
</html>
